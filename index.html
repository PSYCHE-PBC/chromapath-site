<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChromaPath: Connect the Pairs</title>
<meta name="description" content="Connect the pairs. Fill every square. Try a board right here, then get 1000 more in the app.">
<!-- Smart App Banner: Safari on iPhone shows "Get" / "Open" at the top once the app is live. -->
<meta name="apple-itunes-app" content="app-id=6830501249">
<meta property="og:title" content="ChromaPath: Connect the Pairs">
<meta property="og:description" content="Connect the pairs. Fill every square. Try a board in your browser.">
<meta property="og:image" content="https://psyche-pbc.github.io/chromapath-site/img/og.jpg">
<meta property="og:url" content="https://psyche-pbc.github.io/chromapath-site/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--cell:#F1F3F8;--ink:#1A1A2E;--dim:#646980;--line:#DFE3EC;--red:#F2323F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
main{max-width:460px;margin:0 auto;padding:28px 20px 24px;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand img{width:36px;height:36px;border-radius:9px}
h1{font-size:clamp(34px,9vw,46px);line-height:1;font-weight:900;letter-spacing:-.02em;margin:22px 0 8px}
h1 span{color:var(--red)}
.lede{color:var(--dim);margin:0 0 22px}
svg.board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;border-radius:10px}
.stage{position:relative}
.tools{display:flex;justify-content:center;gap:10px;margin:12px 0 26px}
.tools button{font:700 15px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--cell);border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
.win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.95);border-radius:10px;padding:20px}
.win.show{display:flex;animation:pop .35s ease-out}
.win h2{font-size:34px;line-height:1.05;margin:0 0 6px;font-weight:900}
.win p{margin:0 0 18px;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.stores{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.store{display:inline-flex;align-items:center;gap:10px;background:#000;color:#fff;text-decoration:none;border-radius:12px;padding:9px 16px 9px 13px;min-height:52px;text-align:left}
.store svg{width:24px;height:24px;flex:none}
.store small{display:block;font-size:11px;line-height:1.1;opacity:.8}
.store strong{display:block;font-size:17px;line-height:1.15;font-weight:700}
.store.soon{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line);cursor:default}
.note{font-size:14px;color:var(--dim);margin:12px 0 0}
footer{text-align:center;color:var(--dim);font-size:14px;padding:24px 20px 36px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
@media (prefers-reduced-motion:reduce){.win.show{animation:none}}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="img/icon.png" alt="">ChromaPath</div>
  <h1>Connect the pairs.<br><span>Fill every square.</span></h1>
  <p class="lede">Drag a line from each dot to its match. Lines can't cross.</p>

  <div class="stage">
    <svg class="board" id="board" aria-label="A 5×5 ChromaPath board you can play"></svg>
    <div class="win" id="win" role="status" aria-live="polite"></div>
  </div>
  <div class="tools">
    <button id="undo" type="button">Undo</button>
    <button id="restart" type="button">Restart</button>
  </div>

  <div class="stores" data-stores></div>
  <p class="note" data-store-note></p>
</main>
<footer>
  <span>© 2026 Psyche Project PBC</span>
  <a href="mailto:support@psyche.you">support@psyche.you</a>
  <a href="privacy.html">Privacy policy</a>
</footer>

<script>
/* STORES. Flip `live` to true the day each store has the app. Until then the
   button says "Coming soon": Apple only allows its badge for an app that is on
   the App Store. `ref` in the page URL rides along to Play as the referrer. */
const STORES = {
  ios: { live: false, url: "https://apps.apple.com/app/id6830501249", top: "Download on the", name: "App Store",
    icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.65.8-3.33.8-.7 0-1.75-.78-2.88-.76-1.48.02-2.85.86-3.61 2.19-1.54 2.67-.39 6.62 1.11 8.79.73 1.06 1.6 2.25 2.75 2.2 1.1-.04 1.52-.71 2.86-.71 1.33 0 1.71.71 2.88.69 1.19-.02 1.94-1.08 2.66-2.15.84-1.23 1.19-2.42 1.2-2.48-.03-.01-2.3-.88-2.33-3.5zM14.2 6.13c.6-.74 1.01-1.75.9-2.77-.87.04-1.94.58-2.56 1.31-.56.65-1.05 1.69-.92 2.69.97.07 1.97-.49 2.58-1.23z"/></svg>' },
  android: { live: false, url: "https://play.google.com/store/apps/details?id=fun.chromapath.app", top: "Get it on", name: "Google Play",
    icon: '<svg viewBox="0 0 24 24"><path fill="#00D7FE" d="M3.6 2.3 13.4 12l-9.8 9.7c-.3-.2-.5-.6-.5-1V3.3c0-.4.2-.8.5-1z"/><path fill="#FFCE00" d="m17 8.4 3.3 1.9c1.1.6 1.1 2.7 0 3.3L17 15.6 13.4 12z"/><path fill="#FF3A44" d="M17 15.6 13.4 12l-9.8 9.7c.4.3 1 .3 1.6 0z"/><path fill="#00F076" d="M5.2 2.3c-.6-.3-1.2-.3-1.6 0l9.8 9.7L17 8.4z"/></svg>' },
};
const anyLive = Object.values(STORES).some(s => s.live);
function storesHTML() {
  const ref = new URLSearchParams(location.search).get("ref");
  return Object.values(STORES).map(s => {
    if (!s.live) return '<span class="store soon">' + s.icon + "<span><small>Coming soon to</small><strong>" + s.name + "</strong></span></span>";
    const u = new URL(s.url);
    if (ref && u.hostname.includes("play.google")) u.searchParams.set("referrer", "utm_source=" + ref);
    return '<a class="store" href="' + u + '" target="_blank" rel="noopener">' + s.icon + "<span><small>" + s.top + "</small><strong>" + s.name + "</strong></span></a>";
  }).join("");
}
document.querySelectorAll("[data-stores]").forEach(el => el.innerHTML = storesHTML());
document.querySelectorAll("[data-store-note]").forEach(el => el.textContent = anyLive ? "Free to play. 1000 boards, growing up to 14×16." : "Coming to iPhone and Android. Free to play.");

/* THE DEMO: one 5×5 that passes the app's STRICT rule (exactly one way to
   join the pairs, and it covers every square). `s` is each pair's answer. */
const PAINT = ["#E6194B", "#FFD400", "#00B140", "#0A6CFF", "#8A2BE2"];
const B = { w: 5, h: 5, s: [[12,13,14,19,24,23],[18,17,22],[21,20,15],[10,5,0,1,2,3,4,9],[8,7,6,11,16]] };
const svg = document.getElementById("board");
const $ = id => document.getElementById(id);
const xy = c => [c % B.w + .5, ((c / B.w) | 0) + .5];
const ends = new Map(); B.s.forEach((s, p) => { ends.set(s[0], p); ends.set(s[s.length - 1], p); });
let paths = B.s.map(() => []), history = [], drag = null;
svg.setAttribute("viewBox", "0 0 " + B.w + " " + B.h);

function adj(a, b) { return (Math.abs(a - b) === 1 && ((a / B.w) | 0) === ((b / B.w) | 0)) || Math.abs(a - b) === B.w; }
function done(p) { const q = paths[p]; return q.length > 1 && ends.get(q[q.length - 1]) === p && q[q.length - 1] !== q[0]; }
function owner(cell) { for (let p = 0; p < paths.length; p++) { const i = paths[p].indexOf(cell); if (i >= 0) return [p, i]; } return null; }

function draw() {
  let h = "";
  for (let c = 0; c < B.w * B.h; c++) {
    const o = owner(c);
    h += '<rect x="' + (c % B.w) + '" y="' + ((c / B.w) | 0) + '" width="1" height="1" fill="' + (o ? PAINT[o[0]] : "#F1F3F8") + '" fill-opacity="' + (o ? .16 : 1) + '"/>';
  }
  for (let i = 1; i < B.w; i++) h += '<line x1="' + i + '" y1="0" x2="' + i + '" y2="' + B.h + '" stroke="#C9CEDA" stroke-width=".02"/><line x1="0" y1="' + i + '" x2="' + B.w + '" y2="' + i + '" stroke="#C9CEDA" stroke-width=".02"/>';
  paths.forEach((q, p) => { if (q.length > 1) h += '<polyline points="' + q.map(c => xy(c).join(",")).join(" ") + '" fill="none" stroke="' + PAINT[p] + '" stroke-width=".5" stroke-linecap="round" stroke-linejoin="round"/>'; });
  ends.forEach((p, c) => {
    const [x, y] = xy(c);
    h += '<circle cx="' + x + '" cy="' + y + '" r=".4" fill="' + PAINT[p] + '"/><text x="' + x + '" y="' + (y + .015) + '" fill="' + (p === 1 ? "#1A1A2E" : "#fff") + '" font-family="Figtree,system-ui,sans-serif" font-weight="800" font-size=".44" text-anchor="middle" dominant-baseline="central">' + (p + 1) + "</text>";
  });
  svg.innerHTML = h;
}
function cellAt(e) {
  const r = svg.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * B.w), y = Math.floor((e.clientY - r.top) / r.height * B.h);
  return x < 0 || y < 0 || x >= B.w || y >= B.h ? -1 : y * B.w + x;
}
function snapshot() { history.push(paths.map(q => q.slice())); }
function step(c) {
  const q = paths[drag], last = q[q.length - 1];
  if (c === last || !adj(c, last)) return;
  if (q.length > 1 && c === q[q.length - 2]) { q.pop(); return; }
  if (done(drag)) return;
  const own = q.indexOf(c); if (own >= 0) { paths[drag] = q.slice(0, own + 1); return; }
  if (ends.has(c)) { if (ends.get(c) === drag && c !== q[0]) q.push(c); return; }
  const o = owner(c); if (o) paths[o[0]] = paths[o[0]].slice(0, o[1]);
  q.push(c);
}
svg.addEventListener("pointerdown", e => {
  if ($("win").classList.contains("show")) return;
  const c = cellAt(e); if (c < 0) return;
  if (ends.has(c)) { snapshot(); const p = ends.get(c); paths[p] = [c]; drag = p; }
  else { const o = owner(c); if (!o) return; snapshot(); paths[o[0]] = paths[o[0]].slice(0, o[1] + 1); drag = o[0]; }
  svg.setPointerCapture(e.pointerId); draw();
});
svg.addEventListener("pointermove", e => {
  if (drag === null) return;
  const c = cellAt(e); if (c < 0) return;
  // walk one square at a time toward the finger, so a fast swipe doesn't skip squares
  for (let guard = 0; guard < 40; guard++) {
    const q = paths[drag], last = q[q.length - 1];
    if (last === c) break;
    const lx = last % B.w, ly = (last / B.w) | 0, cx = c % B.w, cy = (c / B.w) | 0;
    const nx = lx + Math.sign(cx - lx) * (Math.abs(cx - lx) >= Math.abs(cy - ly) ? 1 : 0);
    const ny = ly + (nx === lx ? Math.sign(cy - ly) : 0);
    const before = q.length + "|" + last;
    step(ny * B.w + nx);
    const q2 = paths[drag];
    if (q2.length + "|" + q2[q2.length - 1] === before) break;
  }
  draw();
});
function end() {
  if (drag === null) return;
  drag = null; draw();
  if (paths.every((_, p) => done(p)) && new Set(paths.flat()).size === B.w * B.h) setTimeout(won, 200);
}
svg.addEventListener("pointerup", end);
svg.addEventListener("pointercancel", end);
function won() {
  $("win").innerHTML = "<h2>You got it.</h2><p>1000 more boards in the app, growing up to 14×16.</p><div class=\"stores\">" + storesHTML() + "</div>";
  $("win").classList.add("show");
}
$("undo").onclick = () => { if (history.length) { paths = history.pop(); draw(); } };
$("restart").onclick = () => { snapshot(); paths = B.s.map(() => []); $("win").className = "win"; draw(); };
draw();
</script>
</body>
</html>
